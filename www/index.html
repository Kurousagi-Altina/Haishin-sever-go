<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>神秘网站·secret web</title>
    <link rel="icon" href="./icon.png" type="image/png">
    <link rel="stylesheet" href="css/common.css">
    <script src="https://cdn.bootcdn.net/ajax/libs/flv.js/1.6.2/flv.min.js" defer></script>
    <script src="js/utils.js"></script>
    <style>
        .top-bar { justify-content: flex-end; }
        .top-bar .admin-link { border-color: #4CAF50; color: #4CAF50; }
        .top-bar .cloud-link { border-color: #2196F3; color: #90CAF9; }
        .top-bar .game-link { border-color: #FF9800; color: #FFB74D; }

        .auth-box input { width: 250px; font-size: 16px; margin-bottom: 10px; }
        .auth-box .error { font-size: 14px; }

        .hall-container {
            display: none; gap: 20px;
            width: 90%; max-width: 1200px; height: 550px;
            margin-top: 20px;
        }
        .hall-container.visible { display: flex; }

        .channel-list {
            flex: 0 0 250px; padding: 20px; border-radius: 15px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); overflow-y: auto;
        }
        .channel-list h3 { margin-top: 0; text-align: center; border-bottom: 1px solid #555; padding-bottom: 10px; }
        .stream-item {
            padding: 10px; margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.1); border-radius: 8px;
            cursor: pointer; transition: 0.3s;
        }
        .stream-item:hover { background: rgba(255, 255, 255, 0.3); transform: scale(1.02); }
        .stream-item.active { background: #4CAF50; }

        .player-container {
            flex: 1; padding: 20px; border-radius: 15px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex; flex-direction: column;
        }
        .player-title { margin-top: 0; margin-bottom: 10px; }
        video { width: 100%; height: 100%; border-radius: 8px; background-color: #000; object-fit: contain; }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <div class="top-bar" id="topBar">
        <span id="topBarGuest" style="display:inline;">
            <a href="/game/" class="game-link" target="_blank">游戏</a>
            <a href="cloud.html" class="cloud-link">云盘</a>
            <button onclick="showRegisterModal()">注册</button>
            <button onclick="showLoginModal()">登录</button>
        </span>
        <span id="topBarUser" style="display:none;">
            <span class="user-info" id="topBarUsername"></span>
            <a href="/game/" class="game-link" target="_blank">游戏</a>
            <a href="cloud.html" class="cloud-link">云盘</a>
            <a class="admin-link" id="topBarAdminLink" href="admin.html" style="display:none;">管理后台</a>
            <button onclick="doLogout()">退出</button>
        </span>
    </div>

    <!-- 注册弹窗 -->
    <div class="modal-overlay" id="registerModal">
        <div class="modal-box">
            <h2>用户注册</h2>
            <input type="text" id="regUsername" placeholder="用户名 (2-32字符)" autocomplete="off">
            <input type="password" id="regPassword" placeholder="密码 (至少6个字符)">
            <input type="password" id="regPassword2" placeholder="确认密码">
            <div>
                <button class="btn-primary" onclick="doRegister()">提交注册</button>
                <button class="btn-cancel" onclick="hideRegisterModal()">取消</button>
            </div>
            <div class="error" id="regError"></div>
            <div class="success" id="regSuccess"></div>
            <div class="switch-link" onclick="hideRegisterModal();showLoginModal();">已有账号？点此登录</div>
        </div>
    </div>

    <!-- 登录弹窗 -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2>用户登录</h2>
            <input type="text" id="loginUsername" placeholder="用户名" autocomplete="off">
            <input type="password" id="loginPassword" placeholder="密码">
            <div>
                <button class="btn-primary" onclick="doLogin()">登录</button>
                <button class="btn-cancel" onclick="hideLoginModal()">取消</button>
            </div>
            <div class="error" id="loginError"></div>
            <div class="switch-link" onclick="hideLoginModal();showRegisterModal();">没有账号？点此注册</div>
        </div>
    </div>

    <!-- 口令验证弹窗（仅未登录用户看到） -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-box">
            <h2>请输入神秘密钥</h2>
            <input type="text" style="display:none;" autocomplete="username">
            <input type="password" id="passwordInput" placeholder="请输入口令..." autocomplete="new-password" autofocus>
            <br>
            <button id="submitBtn">验证</button>
            <div class="error" id="authError"></div>
        </div>
    </div>

    <!-- 直播大厅 -->
    <div class="hall-container" id="hallContainer">
        <div class="channel-list">
            <h3>🔴 在线直播间</h3>
            <div id="listContent">
                <p style="text-align:center; color:#aaa; font-size:14px;">正在搜索信号...</p>
            </div>
        </div>
        <div class="player-container">
            <h3 class="player-title" id="currentPlayerTitle">请在左侧选择频道</h3>
            <video id="videoElement" controls autoplay muted></video>
        </div>
    </div>

    <script>
        var authToken = '';
        var currentUser = null; // { username, role, user_id }
        var flvPlayer = null;
        var currentPlayingStream = '';
        var lastData = [];

        // === API 辅助 ===
        function api(url, method, body) {
            var headers = { 'Content-Type': 'application/json' };
            if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
            var opts = { method: method, headers: headers };
            if (body) opts.body = JSON.stringify(body);
            return fetch(url, opts).then(function(r) {
                if (r.status === 401) {
                    authToken = '';
                    currentUser = null;
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('currentUser');
                    updateTopBar();
                    if (streamPollTimer) { clearInterval(streamPollTimer); streamPollTimer = null; }
                    if (flvPlayer) {
                        flvPlayer.pause(); flvPlayer.unload(); flvPlayer.detachMediaElement();
                        flvPlayer.destroy(); flvPlayer = null;
                    }
                    currentPlayingStream = '';
                    $('hallContainer').classList.remove('visible');
                    $('authOverlay').style.display = 'flex';
                    $('passwordInput').value = '';
                    $('authError').textContent = '登录已过期，请重新验证';
                }
                return r.json();
            });
        }

        // === 顶部栏 ===
        function updateTopBar() {
            if (currentUser && currentUser.role !== 'door') {
                $('topBarGuest').style.display = 'none';
                $('topBarUser').style.display = 'inline';
                $('topBarUsername').textContent = currentUser.username;
                if (currentUser.role === 'admin') {
                    $('topBarAdminLink').style.display = 'inline';
                } else {
                    $('topBarAdminLink').style.display = 'none';
                }
            } else {
                $('topBarGuest').style.display = 'inline';
                $('topBarUser').style.display = 'none';
            }
        }

        function doLogout() {
            authToken = '';
            currentUser = null;
            localStorage.removeItem('authToken');
            localStorage.removeItem('currentUser');
            updateTopBar();
            $('hallContainer').classList.remove('visible');
            $('authOverlay').style.display = 'flex';
            $('passwordInput').value = '';
            $('authError').textContent = '';
            if (flvPlayer) {
                flvPlayer.pause(); flvPlayer.unload(); flvPlayer.detachMediaElement();
                flvPlayer.destroy(); flvPlayer = null;
            }
            currentPlayingStream = '';
            lastData = [];
        }

        // === 注册 ===
        function showRegisterModal() { $('registerModal').classList.add('show'); $('regError').textContent = ''; $('regSuccess').textContent = ''; }
        function hideRegisterModal() { $('registerModal').classList.remove('show'); }

        function doRegister() {
            var u = $('regUsername').value.trim();
            var p = $('regPassword').value;
            var p2 = $('regPassword2').value;
            $('regError').textContent = '';
            $('regSuccess').textContent = '';

            if (u.length < 2 || u.length > 32) { $('regError').textContent = '用户名需在2-32个字符之间'; return; }
            if (p.length < 6) { $('regError').textContent = '密码至少需要6个字符'; return; }
            if (p !== p2) { $('regError').textContent = '两次密码不一致'; return; }

            fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            }).then(function(r) { return r.json(); }).then(function(data) {
                if (data.success) {
                    $('regSuccess').textContent = data.message;
                    $('regUsername').value = '';
                    $('regPassword').value = '';
                    $('regPassword2').value = '';
                } else {
                    $('regError').textContent = data.error || '注册失败';
                }
            }).catch(function() {
                $('regError').textContent = '网络错误，请稍后重试';
            });
        }

        // === 登录 ===
        function showLoginModal() { $('loginModal').classList.add('show'); $('loginError').textContent = ''; }
        function hideLoginModal() { $('loginModal').classList.remove('show'); }

        function doLogin() {
            var u = $('loginUsername').value.trim();
            var p = $('loginPassword').value;
            $('loginError').textContent = '';

            if (!u || !p) { $('loginError').textContent = '请填写用户名和密码'; return; }

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            }).then(function(r) { return r.json(); }).then(function(data) {
                if (data.success) {
                    authToken = data.token;
                    currentUser = { username: data.username, role: data.role, user_id: data.user_id };
                    localStorage.setItem('authToken', authToken);
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    hideLoginModal();
                    updateTopBar();
                    $('authOverlay').style.display = 'none';
                    $('hallContainer').classList.add('visible');
                    fetchLiveStreams();
                    startStreamPolling();
                } else {
                    $('loginError').textContent = data.error || '登录失败';
                }
            }).catch(function() {
                $('loginError').textContent = '网络错误，请稍后重试';
            });
        }

        // === 口令验证（门禁密码） ===
        // 门禁口令不持久化：刷新页面需重新输入
        function doVerify(password) {
            fetch('/api/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: password })
            }).then(function(r) { return r.json(); }).then(function(data) {
                if (data.success) {
                    authToken = data.token;
                    currentUser = { username: '', role: 'door', user_id: 0 };
                    $('authOverlay').style.display = 'none';
                    $('hallContainer').classList.add('visible');
                    updateTopBar();
                    fetchLiveStreams();
                    startStreamPolling();
                } else {
                    $('authError').textContent = data.error || '口令错误，访问拒绝！';
                }
            }).catch(function() {
                $('authError').textContent = '连接服务器失败，请稍后重试';
            });
        }

        $('submitBtn').addEventListener('click', function() {
            doVerify($('passwordInput').value);
        });
        $('passwordInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doVerify($('passwordInput').value);
        });

        // === 初始化：仅恢复已登录用户/admin的token，门禁口令不持久化 ===
        function initAuth() {
            var savedToken = localStorage.getItem('authToken');
            var savedUser = localStorage.getItem('currentUser');
            if (!savedToken || !savedUser) return;

            authToken = savedToken;
            try { currentUser = JSON.parse(savedUser); } catch(e) { currentUser = null; }
            // 仅恢复已注册用户，door token 不持久化
            if (!currentUser || currentUser.role === 'door') {
                authToken = '';
                currentUser = null;
                localStorage.removeItem('authToken');
                localStorage.removeItem('currentUser');
                return;
            }

            fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + authToken } })
                .then(function(r) {
                    if (r.ok) return r.json();
                    throw new Error('invalid');
                })
                .then(function(data) {
                    if (data.role !== 'user' && data.role !== 'admin') throw new Error('invalid');
                    currentUser = data;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    updateTopBar();
                    $('authOverlay').style.display = 'none';
                    $('hallContainer').classList.add('visible');
                    fetchLiveStreams();
                    startStreamPolling();
                })
                .catch(function() {
                    authToken = '';
                    currentUser = null;
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('currentUser');
                    if (streamPollTimer) { clearInterval(streamPollTimer); streamPollTimer = null; }
                    $('hallContainer').classList.remove('visible');
                    $('authOverlay').style.display = 'flex';
                    updateTopBar();
                });
        }

        // === 播放视频 ===
        function playStream(appName, streamName) {
            var streamId = appName + '/' + streamName;
            if (currentPlayingStream === streamId) return;

            var videoElement = $('videoElement');

            if (flvPlayer) {
                flvPlayer.pause(); flvPlayer.unload(); flvPlayer.detachMediaElement();
                flvPlayer.destroy(); flvPlayer = null;
            }

            fetch('/api/stream-url?app=' + encodeURIComponent(appName) + '&stream=' + encodeURIComponent(streamName), {
                headers: { 'Authorization': 'Bearer ' + authToken }
            }).then(function(r) { return r.json(); }).then(function(data) {
                if (!data.url) { console.error('获取流地址失败'); return; }

                if (flvjs.isSupported()) {
                    flvPlayer = flvjs.createPlayer({
                        type: 'flv', isLive: true, hasAudio: true, hasVideo: true, url: data.url
                    }, {
                        enableWorker: false, enableStashBuffer: true, stashInitialSize: 384, autoCleanupSourceBuffer: true
                    });
                    flvPlayer.attachMediaElement(videoElement);
                    flvPlayer.load();
                    flvPlayer.play();

                    currentPlayingStream = streamId;
                    $('currentPlayerTitle').innerText = '正在观看: [' + appName + '] - ' + streamName;
                    renderList(lastData);
                }
            }).catch(function(e) {
                console.error('播放失败:', e);
            });
        }

        // === 获取直播列表 ===
        function fetchLiveStreams() {
            if (!authToken) return;
            api('/api/streams', 'GET').then(function(resJson) {
                if (resJson.code === 0 && resJson.streams) {
                    lastData = resJson.streams;
                    renderList(resJson.streams);
                } else {
                    lastData = [];
                    var errMsg = (resJson.error) || '未知错误';
                    renderError('获取列表失败: ' + errMsg);
                }
            }).catch(function(e) {
                lastData = [];
                renderError('连接服务器失败: ' + e.message);
            });
        }

        function renderError(msg) {
            $('listContent').innerHTML = '<p style="text-align:center; color:#f44336; font-size:13px; padding:20px;">' + msg + '</p>';
        }

        var streamPollTimer = null;
        function startStreamPolling() {
            if (streamPollTimer) clearInterval(streamPollTimer);
            streamPollTimer = setInterval(fetchLiveStreams, 5000);
        }

        // === 渲染列表 ===
        function renderList(streams) {
            var listContent = $('listContent');
            if (streams.length === 0) {
                listContent.innerHTML = '<p style="text-align:center; color:#aaa; font-size:14px;">当前没有人在直播</p>';
                return;
            }

            var html = '';
            streams.forEach(function(stream) {
                var streamId = stream.app + '/' + stream.stream;
                var isActive = currentPlayingStream === streamId ? 'active' : '';
                html += '<div class="stream-item ' + isActive + '" onclick="playStream(\'' + escapeAttr(stream.app) + '\', \'' + escapeAttr(stream.stream) + '\')">'
                    + '<div style="font-size: 16px; font-weight: bold;">' + escapeHtml(stream.stream) + '</div>'
                    + '<div style="font-size: 12px; color: #ddd;">分类: ' + escapeHtml(stream.app) + '</div>'
                    + '<div style="font-size: 12px; color: #bbb; margin-top: 5px;">👀 观看人数: ' + escapeHtml(String(stream.totalReaderCount)) + '</div>'
                    + '</div>';
            });
            listContent.innerHTML = html;
        }

        // === 启动 ===
        updateTopBar();
        initAuth();
    </script>
</body>
</html>
